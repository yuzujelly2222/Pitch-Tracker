<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <title>Baseball DB検索システムトップ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">

</head>

<body>

    <div class="container">

        <div class="icon">⚾</div>

        <h1>Baseball DB検索システム</h1>

        <div class="menu">

            <a href="./b_input" class="batting">
                打者側検索
            </a>
            <a href="./p_input" class="plot">
                投手側検索
            </a>

        </div>

        <div class="footer">
            Baseball Analytics System
        </div>

    </div>

    <script>

        const links = document.querySelectorAll(".menu a");

        links.forEach(link => {

            link.addEventListener("mouseenter", () => {

                link.style.transform =
                    "scale(1.05) rotate(-1deg)";
            });

            link.addEventListener("mouseleave", () => {

                link.style.transform =
                    "scale(1)";
            });

        });

    </script>

</body>
</html>
