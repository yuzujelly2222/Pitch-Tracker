<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <title>Baseball DB検索システムトップ</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;

            background:
                linear-gradient(135deg,
                    #74b9ff,
                    #0984e3);

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {

            background: white;

            width: 500px;

            padding: 40px;

            border-radius: 25px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);

            text-align: center;

            animation: fadeIn 1s;
        }

        h1 {

            color: #2d3436;

            margin-bottom: 40px;

            font-size: 32px;
        }

        .menu {

            display: flex;

            flex-direction: column;

            gap: 20px;
        }

        .menu a {

            text-decoration: none;

            padding: 20px;

            border-radius: 15px;

            color: white;

            font-size: 22px;

            font-weight: bold;

            transition: 0.3s;

            position: relative;

            overflow: hidden;
        }

        .batting {
            background:
                linear-gradient(135deg,
                    #00b894,
                    #00cec9);
        }

        .plot {
            background:
                linear-gradient(135deg,
                    #e17055,
                    #fdcb6e);
        }

        .menu a:hover {

            transform:
                translateY(-5px) scale(1.03);

            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .menu a::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                rgba(255, 255, 255, 0.25);

            transition: 0.5s;
        }

        .menu a:hover::before {

            left: 100%;
        }

        .icon {

            font-size: 60px;

            margin-bottom: 20px;

            animation: spin 5s linear infinite;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .footer {

            margin-top: 30px;

            color: #636e72;

            font-size: 14px;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="icon">⚾</div>

        <h1>Baseball DB検索システム</h1>

        <div class="menu">

            <a href="./b_input" class="batting">
                打者側検索
            </a>
            <a href="./p_input" class="plot">
                投手側検索
            </a>

        </div>

        <div class="footer">
            Baseball Analytics System
        </div>

    </div>

    <script>

        const links = document.querySelectorAll(".menu a");

        links.forEach(link => {

            link.addEventListener("mouseenter", () => {

                link.style.transform =
                    "scale(1.05) rotate(-1deg)";
            });

            link.addEventListener("mouseleave", () => {

                link.style.transform =
                    "scale(1)";
            });

        });

    </script>

</body>
</html>
